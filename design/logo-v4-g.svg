<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="waveShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
      <feOffset dx="0.5" dy="1.5" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background glow -->
  <ellipse cx="32" cy="32" rx="26" ry="20" fill="#06b6d4" opacity="0.08" filter="url(#waveGlow)"/>
  <!-- Back ribbon (C shape flowing into wave) -->
  <path d="M10 18 C10 18 10 46 10 48 Q10 54 16 56 L28 56 Q22 52 18 44 C14 36 16 24 22 18 L28 14 Q20 10 14 14 Q10 16 10 18Z" fill="url(#waveGrad2)" opacity="0.5" filter="url(#waveGlow)"/>
  <!-- Main ribbon: C flowing into P as continuous wave -->
  <path d="M12 16 Q8 20 8 28 C8 40 14 48 24 52 L30 54 L30 42 Q24 40 20 34 C16 28 18 20 24 16 L30 12 L30 8 L24 10 Q16 12 12 16Z" fill="url(#waveGrad)" filter="url(#waveShadow)"/>
  <!-- P as continuing wave -->
  <path d="M30 8 L30 54 L40 54 L40 40 Q46 38 50 34 C56 28 56 18 50 14 Q46 11 40 10 L30 8Z M40 18 L44 20 C48 23 48 29 44 32 L40 34Z" fill="url(#waveGrad)" filter="url(#waveShadow)"/>
  <!-- Top highlight ribbon -->
  <path d="M12 16 Q16 12 24 10 L30 8 L30 12 L24 14 Q18 16 14 20Z" fill="url(#waveHi)"/>
  <path d="M30 8 L40 10 L44 14 L40 14 L30 11Z" fill="url(#waveHi)" opacity="0.7"/>
  <!-- Specular highlights -->
  <circle cx="16" cy="22" r="1.8" fill="white" opacity="0.25"/>
  <circle cx="44" cy="20" r="1.5" fill="white" opacity="0.2"/>
</svg>