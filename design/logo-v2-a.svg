<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- CP Monogram: C wraps around P using negative space -->
  <!-- The C forms an open arc; the P's vertical stroke sits inside -->
  <!-- Where they overlap, negative space creates the P's bowl -->
  <path d="M65 15 A40 40 0 1 0 65 85" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
  <line x1="42" y1="22" x2="42" y2="78" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M42 22 L58 22 A16 16 0 0 1 58 54 L42 54" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small accent dot — the "prompt" indicator -->
  <circle cx="42" cy="88" r="4" fill="#10b981"/>
</svg>
