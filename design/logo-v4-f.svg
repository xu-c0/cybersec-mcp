<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="beamRay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="emitGlow" cx="30%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="beamBloom">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beamSharp">
      <feGaussianBlur stdDeviation="0.4" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Emission point glow -->
  <circle cx="22" cy="32" r="14" fill="url(#emitGlow)"/>
  <!-- Beam rays fanning out -->
  <polygon points="26,28 58,18 58,22 26,30" fill="url(#beamRay)" opacity="0.5"/>
  <polygon points="26,30 58,28 58,36 26,34" fill="url(#beamRay)" opacity="0.7"/>
  <polygon points="26,34 58,42 58,46 26,36" fill="url(#beamRay)" opacity="0.5"/>
  <!-- Bloom on rays -->
  <polygon points="26,29 56,22 56,42 26,35" fill="#06b6d4" opacity="0.06" filter="url(#beamBloom)"/>
  <!-- Main chevron > -->
  <path d="M8 12 L28 32 L8 52" stroke="url(#beamGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#beamBloom)"/>
  <path d="M8 12 L28 32 L8 52" stroke="url(#beamGrad)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#beamSharp)"/>
  <!-- Bright emission dot -->
  <circle cx="28" cy="32" r="3" fill="#10b981" opacity="0.5" filter="url(#beamBloom)"/>
  <circle cx="28" cy="32" r="1.5" fill="white" opacity="0.6"/>
  <!-- Top edge highlight -->
  <path d="M9 13 L22 27" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.25"/>
  <!-- Specular -->
  <circle cx="14" cy="18" r="1.5" fill="white" opacity="0.2"/>
</svg>