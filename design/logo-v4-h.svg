<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crystGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="crystDark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9668" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="crystLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="crystCore" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="crystGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crystInner">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="b"/>
      <feOffset dx="0.8" dy="1.2" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="24" fill="url(#crystGrad)" opacity="0.12" filter="url(#crystGlow)"/>
  <!-- C shape built from crystal facets -->
  <!-- Top-left facet (bright) -->
  <polygon points="18,12 34,8 30,20 14,22" fill="url(#crystLight)" filter="url(#crystInner)"/>
  <!-- Left facet (medium) -->
  <polygon points="14,22 30,20 26,36 10,32" fill="url(#crystGrad)" filter="url(#crystInner)"/>
  <!-- Bottom-left facet (dark) -->
  <polygon points="10,32 26,36 30,48 18,52" fill="url(#crystDark)" filter="url(#crystInner)"/>
  <!-- Top-right facet (medium-bright) -->
  <polygon points="34,8 50,14 44,22 30,20" fill="url(#crystGrad)" opacity="0.85" filter="url(#crystInner)"/>
  <!-- Bottom-right facet (medium-dark) -->
  <polygon points="30,48 44,42 50,50 34,56" fill="url(#crystDark)" opacity="0.85" filter="url(#crystInner)"/>
  <!-- Bottom facet -->
  <polygon points="18,52 34,56 34,48 30,48" fill="url(#crystGrad)" opacity="0.7"/>
  <!-- Inner core glow -->
  <circle cx="30" cy="30" r="12" fill="url(#crystCore)"/>
  <!-- Facet edge highlights -->
  <line x1="30" y1="20" x2="26" y2="36" stroke="white" stroke-width="0.6" opacity="0.3"/>
  <line x1="30" y1="20" x2="14" y2="22" stroke="white" stroke-width="0.6" opacity="0.25"/>
  <line x1="30" y1="20" x2="44" y2="22" stroke="white" stroke-width="0.5" opacity="0.2"/>
  <!-- Specular highlight -->
  <circle cx="24" cy="18" r="2.2" fill="white" opacity="0.3"/>
  <circle cx="22" cy="16" r="1" fill="white" opacity="0.45"/>
</svg>