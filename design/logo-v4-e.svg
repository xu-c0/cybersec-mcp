<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="stackC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="stackP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="stackBlend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5c7"/>
      <stop offset="100%" stop-color="#2596d1"/>
    </linearGradient>
    <filter id="stackGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stackInner">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="b"/>
      <feOffset dx="0.8" dy="1" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Glow -->
  <circle cx="32" cy="32" r="22" fill="#06b6d4" opacity="0.08" filter="url(#stackGlow)"/>
  <!-- C shape (back layer) -->
  <path d="M8 14 L8 50 L28 56 L28 46 L18 43 L18 21 L28 18 L28 8Z" fill="url(#stackC)" opacity="0.75" filter="url(#stackInner)"/>
  <!-- P shape (front layer, offset right) -->
  <path d="M26 10 L26 54 L38 54 L38 38 L46 34 C52 29 52 17 46 13Z M38 20 L42 22 C45 24 45 28 42 30 L38 32Z" fill="url(#stackP)" opacity="0.75" filter="url(#stackInner)"/>
  <!-- Overlap zone - blended color, brighter -->
  <path d="M26 10 L28 8 L28 18 L26 20Z" fill="url(#stackBlend)" opacity="0.85"/>
  <path d="M26 44 L28 46 L28 56 L26 54Z" fill="url(#stackBlend)" opacity="0.85"/>
  <rect x="26" y="20" width="2" height="24" fill="url(#stackBlend)" opacity="0.7"/>
  <!-- Highlight on C top -->
  <path d="M8 14 L28 8 L28 13 L14 17Z" fill="white" opacity="0.2"/>
  <!-- Highlight on P bowl -->
  <path d="M38 20 L42 22 L40 24 L38 23Z" fill="white" opacity="0.25"/>
  <!-- Specular dots -->
  <circle cx="16" cy="20" r="2" fill="white" opacity="0.2"/>
  <circle cx="40" cy="18" r="1.5" fill="white" opacity="0.2"/>
</svg>