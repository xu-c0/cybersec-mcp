<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="h5g1" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="h5g2" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="h5g3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/><stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="h5core" cx="35%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.12"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="h5glow">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h5sh">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.7" result="b"/>
      <feOffset dx="0.5" dy="1" result="o"/><feFlood flood-color="#000" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="22" fill="url(#h5g2)" opacity="0.1" filter="url(#h5glow)"/>
  <!-- Minimal 4-facet C — bold, iconic -->
  <!-- Top facet (bright) -->
  <polygon points="20,11 46,13 32,24 14,22" fill="url(#h5g1)" filter="url(#h5sh)"/>
  <!-- Left facet (medium) -->
  <polygon points="14,22 32,24 28,44 10,38" fill="url(#h5g2)" filter="url(#h5sh)"/>
  <!-- Bottom facet (dark) -->
  <polygon points="10,38 28,44 46,52 20,53" fill="url(#h5g3)" filter="url(#h5sh)"/>
  <!-- Right-top cap -->
  <polygon points="46,13 52,18 40,24 32,24" fill="url(#h5g2)" opacity="0.7" filter="url(#h5sh)"/>
  <!-- Right-bottom cap -->
  <polygon points="28,44 40,42 52,48 46,52" fill="url(#h5g3)" opacity="0.75" filter="url(#h5sh)"/>
  <!-- Core glow -->
  <circle cx="28" cy="30" r="10" fill="url(#h5core)"/>
  <!-- Bold edge highlights -->
  <line x1="32" y1="24" x2="28" y2="44" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <line x1="14" y1="22" x2="32" y2="24" stroke="#fff" stroke-width="0.7" opacity="0.25"/>
  <!-- Strong specular -->
  <circle cx="24" cy="18" r="2.5" fill="#fff" opacity="0.3"/>
  <circle cx="22" cy="16" r="1.1" fill="#fff" opacity="0.5"/>
</svg>