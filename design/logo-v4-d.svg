<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bladeGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bladeShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
      <feOffset dx="1" dy="1.5" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="slashClip"><rect x="0" y="0" width="29" height="64"/></clipPath>
    <clipPath id="slashClip2"><rect x="35" y="0" width="29" height="64"/></clipPath>
  </defs>
  <!-- Glow backdrop -->
  <path d="M10 14 L32 6 L54 14 L54 50 L32 58 L10 50Z" fill="url(#bladeGrad)" opacity="0.15" filter="url(#bladeGlow)"/>
  <!-- C letter - sharp angular blade -->
  <path d="M12 16 L30 8 L30 18 L22 21 L22 43 L30 46 L30 56 L12 48Z" fill="url(#bladeGrad)" filter="url(#bladeShadow)"/>
  <!-- P letter - sharp angular blade -->
  <path d="M34 8 L34 56 L44 56 L44 40 L50 36 C56 31 56 17 50 13Z M44 18 L47 20 C50 22 50 28 47 30 L44 32Z" fill="url(#bladeGrad)" filter="url(#bladeShadow)"/>
  <!-- Diagonal slash cutting through both letters -->
  <line x1="18" y1="52" x2="50" y2="10" stroke="url(#bladeEdge)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Slash glow -->
  <line x1="18" y1="52" x2="50" y2="10" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.15" filter="url(#bladeGlow)"/>
  <!-- Sharp edge highlights on C -->
  <path d="M12 16 L30 8 L30 14 L18 19Z" fill="white" opacity="0.2"/>
  <!-- Sharp edge highlight on P -->
  <path d="M34 8 L50 13 L47 17 L34 12Z" fill="white" opacity="0.15"/>
  <!-- Specular dot -->
  <circle cx="20" cy="20" r="1.8" fill="white" opacity="0.3"/>
</svg>