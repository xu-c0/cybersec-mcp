<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Signal Mark: Three concentric arc pulses emanating from a focal point -->
  <!-- Suggests scanning, detection, signal — like radar but abstracted -->
  <!-- The focal point is offset bottom-left for dynamic asymmetry -->
  <circle cx="25" cy="75" r="5" fill="#10b981"/>
  <path d="M25 75 A15 15 0 0 1 40 60" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M25 75 A30 30 0 0 1 55 45" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M25 75 A45 45 0 0 1 70 30" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M25 75 A60 60 0 0 1 85 15" stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Small crosshair at the peak of the outermost arc -->
  <line x1="82" y1="15" x2="88" y2="15" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="12" x2="85" y2="18" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>
