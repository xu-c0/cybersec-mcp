<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="h2g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/><stop offset="50%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="h2g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="h2prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6"/><stop offset="25%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="75%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="h2frost">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h2blur">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="h2glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Soft outer glow -->
  <circle cx="32" cy="32" r="24" fill="url(#h2g1)" opacity="0.15" filter="url(#h2glow)"/>
  <!-- Frosted glass C shape — smooth rounded path -->
  <path d="M44,16 C36,10 22,10 15,18 C8,26 8,38 15,46 C22,54 36,54 44,48" fill="url(#h2g1)" stroke="url(#h2g2)" stroke-width="8" stroke-linecap="round" fill-opacity="0.15" filter="url(#h2frost)"/>
  <!-- Inner frosted layer -->
  <path d="M42,18 C35,13 24,13 18,20 C12,27 12,37 18,44 C24,51 35,51 42,46" fill="none" stroke="url(#h2g1)" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="url(#h2blur)"/>
  <!-- Prismatic edge refraction -->
  <path d="M44,16 C36,10 22,10 15,18 C8,26 8,38 15,46 C22,54 36,54 44,48" fill="none" stroke="url(#h2prism)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Glass highlight -->
  <path d="M40,17 C34,12 24,13 19,19" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Specular dots -->
  <circle cx="22" cy="18" r="2" fill="#fff" opacity="0.25" filter="url(#h2blur)"/>
  <circle cx="20" cy="16" r="0.8" fill="#fff" opacity="0.4"/>
  <!-- Subtle inner reflection -->
  <ellipse cx="28" cy="32" rx="8" ry="12" fill="url(#h2g2)" opacity="0.08" filter="url(#h2blur)"/>
</svg>