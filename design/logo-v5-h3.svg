<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="h3core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="h3dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/><stop offset="100%" stop-color="#0c1a30" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="h3neon" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="40%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="h3glow1">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h3glow2">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h3inner">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="b"/>
      <feOffset dx="0.4" dy="0.8" result="o"/><feFlood flood-color="#000" flood-opacity="0.5" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Intense outer neon glow -->
  <circle cx="32" cy="32" r="26" fill="url(#h3neon)" opacity="0.3" filter="url(#h3glow1)"/>
  <!-- Dark crystal facets — outer shell -->
  <polygon points="19,12 35,8 32,20 16,21" fill="url(#h3dark)" filter="url(#h3inner)"/>
  <polygon points="35,8 50,14 44,23 32,20" fill="url(#h3dark)" filter="url(#h3inner)"/>
  <polygon points="16,21 32,20 28,36 10,32" fill="url(#h3dark)" filter="url(#h3inner)"/>
  <polygon points="10,32 28,36 30,48 17,52" fill="url(#h3dark)" filter="url(#h3inner)"/>
  <polygon points="17,52 30,48 35,56 22,57" fill="url(#h3dark)" filter="url(#h3inner)"/>
  <polygon points="30,48 44,42 50,50 35,56" fill="url(#h3dark)" filter="url(#h3inner)" opacity="0.85"/>
  <!-- Neon interior glow — shines through facet cracks -->
  <line x1="32" y1="20" x2="28" y2="36" stroke="url(#h3core)" stroke-width="1.8" opacity="0.85" filter="url(#h3glow2)"/>
  <line x1="16" y1="21" x2="32" y2="20" stroke="url(#h3core)" stroke-width="1.4" opacity="0.7" filter="url(#h3glow2)"/>
  <line x1="28" y1="36" x2="10" y2="32" stroke="url(#h3core)" stroke-width="1.2" opacity="0.6" filter="url(#h3glow2)"/>
  <line x1="28" y1="36" x2="30" y2="48" stroke="url(#h3core)" stroke-width="1.4" opacity="0.7" filter="url(#h3glow2)"/>
  <line x1="35" y1="8" x2="32" y2="20" stroke="url(#h3core)" stroke-width="1.2" opacity="0.6" filter="url(#h3glow2)"/>
  <!-- Core glow -->
  <circle cx="28" cy="30" r="8" fill="url(#h3neon)" opacity="0.4" filter="url(#h3glow1)"/>
  <!-- Hot specular -->
  <circle cx="25" cy="18" r="1.8" fill="#67e8f9" opacity="0.6" filter="url(#h3glow2)"/>
  <circle cx="24" cy="17" r="0.7" fill="#fff" opacity="0.7"/>
</svg>