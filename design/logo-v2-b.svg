<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- The Prompt Cursor: A stylized ">" chevron with a blinking cursor line -->
  <!-- The chevron is thick and confident, the cursor pulses beside it -->
  <!-- Abstract, not a literal terminal — suggests direction and input -->
  <path d="M18 20 L55 50 L18 80" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68" y1="25" x2="68" y2="75" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <!-- Accent: small scanning ray extending right from cursor -->
  <line x1="68" y1="50" x2="90" y2="50" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="93" r="3" cy="50" fill="#10b981" opacity="0.6"/>
</svg>
