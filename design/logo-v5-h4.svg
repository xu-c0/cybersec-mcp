<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="h4g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/><stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="h4g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.75"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="h4g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="h4g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="h4shadow">
      <feDropShadow dx="0.8" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="h4glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ambient glow -->
  <circle cx="32" cy="32" r="24" fill="#06b6d4" opacity="0.08" filter="url(#h4glow)"/>
  <!-- Layer 4 (deepest, purple-blue) — offset back-right -->
  <path d="M46,18 C39,11 26,11 19,18 C12,25 12,38 19,45 C26,52 39,52 46,46" fill="none" stroke="url(#h4g4)" stroke-width="6" stroke-linecap="round" filter="url(#h4shadow)" transform="translate(3,3)"/>
  <!-- Layer 3 (blue) — offset slightly -->
  <path d="M46,18 C39,11 26,11 19,18 C12,25 12,38 19,45 C26,52 39,52 46,46" fill="none" stroke="url(#h4g3)" stroke-width="6" stroke-linecap="round" filter="url(#h4shadow)" transform="translate(1.5,1.5)"/>
  <!-- Layer 2 (cyan) — near center -->
  <path d="M46,18 C39,11 26,11 19,18 C12,25 12,38 19,45 C26,52 39,52 46,46" fill="none" stroke="url(#h4g2)" stroke-width="6" stroke-linecap="round" filter="url(#h4shadow)" transform="translate(0,0)"/>
  <!-- Layer 1 (green, front) — offset forward-left -->
  <path d="M46,18 C39,11 26,11 19,18 C12,25 12,38 19,45 C26,52 39,52 46,46" fill="none" stroke="url(#h4g1)" stroke-width="6" stroke-linecap="round" filter="url(#h4shadow)" transform="translate(-1.5,-1.5)"/>
  <!-- Front layer highlight -->
  <path d="M44,17 C38,12 27,12 21,18" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.3" transform="translate(-1.5,-1.5)"/>
  <!-- Specular -->
  <circle cx="21" cy="16" r="1.8" fill="#fff" opacity="0.3"/>
  <circle cx="20" cy="15" r="0.7" fill="#fff" opacity="0.45"/>
  <!-- Subtle facet lines on front layer -->
  <line x1="17" y1="24" x2="17" y2="40" stroke="#fff" stroke-width="0.4" opacity="0.15" transform="translate(-1.5,-1.5)"/>
</svg>